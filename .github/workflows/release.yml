name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - name: Run tests
        run: cargo test --all-targets
      - name: Build .deb package
        run: |
          chmod +x packaging/debian/build-deb.sh
          sed -i 's/cargo build --release --offline --bins/cargo build --release --locked --bins/' packaging/debian/build-deb.sh
          ./packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm base-devel rust cargo git libx11 libxcb libxkbcommon libglvnd curl bzip2 unzip
      - name: Build Arch package
        run: |
          useradd -m builder
          mkdir -p /tmp/archbuild/src
          cp -r "$GITHUB_WORKSPACE" "/tmp/archbuild/src/native-furcadia-${GITHUB_REF_NAME#v}"
          cp packaging/arch/PKGBUILD /tmp/archbuild/PKGBUILD
          chown -R builder:builder /tmp/archbuild
          su - builder -c 'cd /tmp/archbuild && PKGDEST=/tmp/archbuild makepkg -e --noconfirm'
          mkdir -p dist
          cp /tmp/archbuild/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows binaries
        run: cargo build --release --locked --bins
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc packaging/windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FurcadiaNative-Setup-*.exe

  release:
    needs: [build-deb, build-arch, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          name: "Furcadia Native Client v2.1.2 — Character Picker Custom Portraits & Persistent Portrait Cache"
          body: |
            ## Furcadia Native Client v2.1.2 — Character Picker Custom Portraits & Persistent Portrait Cache

            A native, lightweight Rust client for Furcadia supporting Linux and Windows.

            ### Highlights
            - Fast native GUI (`furc-gui`) built with `eframe` / `egui` and CLI (`furc-cli`)
            - Modern dream rendering, remappable portraits, desctags, and avatar/digo support
            - Multi-character tabs, player badges in chat, and drag-to-reorder player/whisper tabs
            - Pounce friend watchlist, saved dreams, chat logging, and Windows Furcadia asset import
            - Linux system tray with alert blinking & unread badge, plus integrated desktop launcher icons

            ### What's New in v2.1.2
            - **Character Picker Custom Portrait Loading & Fallback Downloads**:
              - Triggered on-demand `UiToNet::DownloadPortrait` requests from `custom_portrait_texture` whenever a resolved custom portrait ID is not yet cached in memory, and added fallback downloads from the file server if cached `.fprt` files fail decoding.
            - **Persistent Portrait Cache (`config.ini`) & `last_port` Filtering**:
              - Added `character_portraits` (`ClientConfig::character_portraits`) persistence across launches with shared-settings merging, and filtered `clogin.php` `last_port > 16` so `1..=16` portrait slot indices are ignored while `]&`-resolved `pp<id>` file IDs take precedence.
            - **Silent Self-`glook` & Accurate Portrait Directive Attribution**:
              - Sent a silent self-`glook` on `ServerMessage::CharacterIdentity` and after clicking **Change Portrait** (`portrchng`) without popping up the `LookedPlayerCard`, matched `]&` portrait directives against `account_info.characters` IDs before falling back to `glook` targets, and wired background-tab portrait directives and downloads in `poll_bg_sessions`.

            ### What's New in v2.1.1
            - **In-Game Dream Downloading Overlay & Live Progress**:
              - Added a translucent Furcadia-themed overlay card centered over the map viewport while a dream downloads and extracts, showing the dream name, current stage (`Connecting to dream server...` → `Downloading dream package...` → `Extracting dream assets...`), a determinate progress bar from HTTP `Content-Length` (or animated bar when omitted), byte counters (`received / total (%)`), and live sidebar `Dream: <name> (DL xx%)` status.
            - **Large Dream Download Timeout Fix**:
              - Replaced the fixed 25-second `curl` cutoff with streaming progress (`--connect-timeout 15 --speed-time 30 --speed-limit 512 --max-time 300`) so large multi-megabyte dream packages (e.g., `pmallegria`, `pmfurn`) complete reliably on slower connections while still aborting on genuine stalls.

            ### What's New in v2.1.0
            - **Custom Portrait Decoding & Classic 8-Bit Remapping Fixes**:
              - **13-Bit LZW Table-Full `CLEAR` Support**: Fixed `decompress_furcadia_lzw` for real 95×95 `FPRT10`/`FPRT01` custom portraits whose LZW dictionary reaches 4095 entries and emits the table-full `CLEAR` code (`0x100`) at 13 bits before resetting to 9 bits.
              - **Classic 8-Bit Portrait Recoloring**: Added `Palette::with_classic_remap_markers` to translate Furcadia's classic 8-bit remappable palette ranges (Fur, Markings, Hair, Vest, Bracers, Cape, Boots, Trousers, Eyes, and Badge) into FOX5 remap markers so 8-bit `FSH`/`FSHX` portraits Inside `FPRT01` and `FPRT20` properly recolor to match each character's color code while keeping static palette indices intact.
              - **Persistent Portrait ID Mapping Across Dream Transfers**: Preserved `player_portrait_ids` across dream changes (`clear_dream_assets`) so players' custom portraits continue displaying without requiring a new look/spawn packet after entering a dream.
            - **In-Game Reconnect & Dream Entry Reliability**:
              - **Clean Reconnect State Reset**: Clicking **Reconnect** from the in-game disconnect banner now tracks an explicit `reconnecting` state (displaying live connection stage progress in the banner), clears stale avatars and pending dream state (`pending_dream_name`, `pending_dream_modern`, `world.avatars`, `world.map_name`), and logs a `Reconnecting as <Name>...` status line.
              - **Guaranteed `vascodagama` Handshake Timer**: Scheduled automatic 50ms UI repaints while `pending_vascodagama` or `reconnecting` is active so the post-login `vascodagama` dream-entry command fires reliably after 500ms even when the window is idle or unfocused.
            - **Chat Scroll Pinning Across Banner & Layout Shifts**:
              - Added explicit `chat_pinned_to_bottom` and `chat_scroll_to_bottom` tracking so the chat log and whisper tabs stay pinned to the newest line when the disconnect/reconnect banner appears or disappears, when the multi-line input box expands, or when switching tabs and sending messages—while respecting manual upward scrolling.
            - **Multibyte Chat Line Safety**:
              - Replaced byte-index slicing in `rewrite_pounce_add_message` with safe `.get(..prefix.len())` checks to prevent panics when multi-byte UTF-8 characters (such as full-width symbols) straddle the prefix boundary.

            ### Milestone 2.0 General Stability, Security & Open-Source Foundation
            - **Long-Session Memory, GPU Texture & Thread Leak Fixes**:
              - Closed character tabs cleanly terminate their `network_worker` thread and close live sockets when dropped.
              - Bounded GPU texture and sprite caches (`avatar_textures`, `custom_portrait_textures`, `custom_portrait_rgba`, `chat_img_textures`) with automatic eviction and disconnect cleanup.
              - Capped in-memory chat and whisper tab histories (full history remains persisted to disk logs) and gated/rotated `login_trace.log` behind debug packet logging.
            - **Security & Privacy Hardening**:
              - Surfaced a clear GUI/CLI notice when connecting over Furcadia's legacy/unverified TLS handshake.
              - Hardened `curl` asset/image downloads with `--proto =http,https`, `--proto-redir =http,https`, `--max-filesize`, and `--` argument termination.
              - Atomic `0o600` config creation on Unix to eliminate the `config.ini` permissions race, plus newline-safe serialization that preserves leading/trailing password whitespace, and dream path sanitization.
            - **Parser, Decompressor & Protocol Safety**:
              - Hard decompression byte limits across LZMA (`.fox`), BZip2 (`.rch` / portraits), and Furcadia LZW decoders to prevent decompression bombs.
              - Checked arithmetic and dimension bounds across `.fox` and `.map` parsers, bounded network line reads in `FurcadiaClient`, multi-address DNS fallback, and 97 passing unit tests with zero Clippy warnings.

            ### Installation

            #### Windows
            1. Download `FurcadiaNative-Setup-2.1.2-x86_64.exe` from the assets below.
            2. Run the installer. It installs `furc-gui` and `furc-cli`, adds a **Furcadia Native Client** entry to your Start Menu, and registers an uninstaller in Windows Apps & Features.

            #### Debian / Ubuntu / Linux Mint
            ```sh
            sudo apt install ./furcadia-native_2.1.2_amd64.deb
            ```
            Or double-click the `.deb` file to install via your graphical package manager.

            #### Arch Linux / CachyOS / Manjaro / EndeavourOS
            Download the `.pkg.tar.zst` asset and install with:
            ```sh
            sudo pacman -U furcadia-native-2.1.2-1-x86_64.pkg.tar.zst
            ```
            Or build from source with `PKGBUILD`:
            ```sh
            git clone https://github.com/morganlowe/native-furcadia.git
            cd native-furcadia/packaging/arch
            makepkg -si
            ```
          files: |
            artifacts/debian-package/*.deb
            artifacts/arch-package/*.pkg.tar.zst
            artifacts/windows-installer/*.exe
