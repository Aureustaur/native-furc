name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - name: Run tests
        run: cargo test --all-targets
      - name: Build .deb package
        run: |
          chmod +x packaging/debian/build-deb.sh
          sed -i 's/cargo build --release --offline --bins/cargo build --release --locked --bins/' packaging/debian/build-deb.sh
          ./packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm base-devel rust cargo git libx11 libxcb libxkbcommon libglvnd curl bzip2 unzip
      - name: Build Arch package
        run: |
          useradd -m builder
          mkdir -p /tmp/archbuild/src
          cp -r "$GITHUB_WORKSPACE" "/tmp/archbuild/src/native-furcadia-${GITHUB_REF_NAME#v}"
          cp packaging/arch/PKGBUILD /tmp/archbuild/PKGBUILD
          chown -R builder:builder /tmp/archbuild
          su - builder -c 'cd /tmp/archbuild && PKGDEST=/tmp/archbuild makepkg -e --noconfirm'
          mkdir -p dist
          cp /tmp/archbuild/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows binaries
        run: cargo build --release --locked --bins
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc packaging/windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FurcadiaNative-Setup-*.exe

  release:
    needs: [build-deb, build-arch, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          name: "Furcadia Native Client v2.0.0 — Milestone 2.0: Stability, Security & Open-Source Polish"
          body: |
            ## Furcadia Native Client v2.0.0 — Milestone 2.0: Stability, Security & Open-Source Polish

            A native, lightweight Rust client for Furcadia supporting Linux and Windows.

            ### Highlights
            - Fast native GUI (`furc-gui`) built with `eframe` / `egui` and CLI (`furc-cli`)
            - Modern dream rendering, remappable portraits, desctags, and avatar/digo support
            - Multi-character tabs, player badges in chat, and drag-to-reorder player/whisper tabs
            - Pounce friend watchlist, saved dreams, chat logging, and Windows Furcadia asset import
            - Linux system tray with alert blinking & unread badge, plus integrated desktop launcher icons

            ### What's New in v2.0.0 (Milestone 2.0)
            - **Long-Session Memory, GPU Texture & Thread Leak Fixes**:
              - Closed character tabs now cleanly terminate their `network_worker` thread and close live sockets when dropped.
              - Bounded GPU texture and sprite caches (`avatar_textures`, `custom_portrait_textures`, `custom_portrait_rgba`, `chat_img_textures`) with automatic eviction and dream/disconnect cleanup for `player_portrait_ids`.
              - Capped in-memory chat and whisper tab histories (full history remains persisted to disk logs) and gated/rotated `login_trace.log` behind debug packet logging.
            - **Security & Privacy Hardening**:
              - Surfaced a clear GUI notice when connecting over Furcadia's legacy/unverified TLS handshake.
              - Hardened `curl` asset/image downloads with `--proto =http,https`, `--proto-redir =http,https`, `--max-filesize`, and `--` argument termination.
              - Atomic `0o600` config creation on Unix to eliminate the `config.ini` permissions race, plus newline-safe serialization that preserves leading/trailing password whitespace.
              - Guarded against empty `safe_name` paths in dream downloads so malformed map names can never target the parent dreams cache directory.
            - **Parser, Decompressor & Protocol Safety**:
              - Added hard decompression byte limits across LZMA (`.fox`), BZip2 (`.rch` / portraits), and Furcadia LZW decoders to prevent decompression bombs.
              - Fixed a 12-bit LZW bit-width overflow on large portraits (`nbits` capped at 12).
              - Added checked arithmetic and dimension bounds across `.fox` and `.map` parsers, plus bounded network line reads in `FurcadiaClient`.
              - Fixed `auth.rs` XML attribute boundary matching, multi-address DNS fallback, stale `SessionState` on failed TLS upgrade, 32-bit Unix `localtime_r` safety, and duplicate `quit` in `furc-cli`.
            - **Open-Source Codebase Polish**:
              - Expanded rustdoc and inline documentation across core protocol, archive, and GUI modules.
              - Resolved all 45 Clippy warnings (`cargo clippy --all-targets -- -D warnings` passes cleanly) and expanded the unit test suite to 94 passing tests.

            ### Installation

            #### Windows
            1. Download `FurcadiaNative-Setup-2.0.0-x86_64.exe` from the assets below.
            2. Run the installer. It installs `furc-gui` and `furc-cli`, adds a **Furcadia Native Client** entry to your Start Menu, and registers an uninstaller in Windows Apps & Features.

            #### Debian / Ubuntu / Linux Mint
            ```sh
            sudo apt install ./furcadia-native_2.0.0_amd64.deb
            ```
            Or double-click the `.deb` file to install via your graphical package manager.

            #### Arch Linux / CachyOS / Manjaro / EndeavourOS
            Download the `.pkg.tar.zst` asset and install with:
            ```sh
            sudo pacman -U furcadia-native-2.0.0-1-x86_64.pkg.tar.zst
            ```
            Or build from source with `PKGBUILD`:
            ```sh
            git clone https://github.com/morganlowe/native-furcadia.git
            cd native-furcadia/packaging/arch
            makepkg -si
            ```
          files: |
            artifacts/debian-package/*.deb
            artifacts/arch-package/*.pkg.tar.zst
            artifacts/windows-installer/*.exe
