name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Build debug-signed APK
        working-directory: android
        run: cargo apk build
      - name: Collect APK
        run: |
          mkdir -p dist/android
          apk=$(find android/target -type f -name 'furcadia-native*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" dist/android/furcadia-native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-sideload-apk
          path: dist/android/furcadia-native.apk
          if-no-files-found: error
